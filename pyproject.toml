[project]
name = "one-key-takeoff"
version = "0.1.0"
description = "One-Key Autonomous Takeoff and Navigation API for ArduPilot / MAVLink Drones"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "geopy>=2.5.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "pymavlink>=2.4.49",
    "pyserial>=3.5",
    "uvicorn>=0.52.1",
]

[project.scripts]
one-key-takeoff = "one_key_takeoff.main:start"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.1",
]

[tool.uv]
package = true

[tool.pyright]
extraPaths = ["src"]
